{% extends 'base.html' %}{% block title %}Nouveau message{% endblock %}{% block page_title %}Nouveau message{% endblock %}
{% block content %}
<div class='card' style='max-width:600px;'><div class='card-body p-4'>
  <form method='post'>{% csrf_token %}
    <div class='mb-3'><label class='form-label fw-semibold'>Destinataire</label>
      <select name='recipient' class='form-select' required>
        <option value=''>-- Choisir --</option>
        {% for u in recipients %}<option value='{{ u.pk }}'>{{ u.get_full_name }} ({{ u.get_role_display }})</option>{% endfor %}
      </select></div>
    <div class='mb-3'><label class='form-label fw-semibold'>Sujet</label>
      <input type='text' name='subject' class='form-control' required placeholder='Sujet'></div>
    <div class='mb-4'><label class='form-label fw-semibold'>Message</label>
      <textarea name='content' class='form-control' rows='5' required placeholder='Votre message...'></textarea></div>
    <div class='d-flex gap-2'>
      <button type='submit' class='btn btn-primary'><i class='bi bi-send me-2'></i>Envoyer</button>
      <a href='{% url "messaging:inbox" %}' class='btn btn-outline-secondary'>Annuler</a>
    </div>
  </form>
</div></div>{% endblock %}
